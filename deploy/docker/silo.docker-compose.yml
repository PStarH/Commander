# =============================================================================
# Silo deployment for a single tenant.
#
# UNSUPPORTED LEGACY TEMPLATE — topology illustration only.
# This template is not a maintained deployment path and does not start a
# working production service on its own: it supplies neither the six required
# API startup credentials nor a kernel/Postgres DSN nor database TLS material,
# so the container exits during startup validation. For a supported deployment
# use docs/deploy.md (staged Compose / Helm lifecycle).
#
# Usage (from repo root):
#   export TENANT_ID=acme-corp
#   envsubst < deploy/docker/silo.docker-compose.yml > /tmp/silo-${TENANT_ID}.yml
#   docker compose -f /tmp/silo-${TENANT_ID}.yml up -d
#
# Each silo tenant runs an isolated API container with its own PVC/volume.
# =============================================================================

services:
  commander-silo-${TENANT_ID}:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: production
      args:
        - NODE_ENV=production
    image: ${COMMANDER_IMAGE:-commander-api:latest}
    container_name: commander-silo-${TENANT_ID}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - TENANT_ID=${TENANT_ID}
      - DEPLOYMENT_MODEL=silo
      - TENANT_CONFIG_PATH=/app/config/tenants.json
      - COMMANDER_DATA_ROOT=/data
      - COMMANDER_API_KEY=${COMMANDER_API_KEY:?COMMANDER_API_KEY is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Tenant API keys. Supplied through the environment rather than a bind
      # mount: the runtime file is created on first use, so mounting a
      # repository-relative path would fail on a fresh clone.
      - TENANT_API_KEYS=${TENANT_API_KEYS:-}
    volumes:
      # Shared tenant registry (read-only at runtime)
      - ../../config/tenants.json:/app/config/tenants.json:ro
      # Dedicated tenant data volume
      - silo-data-${TENANT_ID}:/data/tenants/${TENANT_ID}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  silo-data-${TENANT_ID}:
    driver: local
