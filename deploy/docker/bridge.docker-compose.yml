# =============================================================================
# Bridge deployment for a group of tenants that share a container / namespace
# but keep logically-isolated data subdirectories.
#
# UNSUPPORTED LEGACY TEMPLATE — topology illustration only.
# This template is not a maintained deployment path and does not start a
# working production service on its own: it supplies neither the six required
# API startup credentials nor a kernel/Postgres DSN nor database TLS material,
# so the container exits during startup validation. For a supported deployment
# use docs/deploy.md (staged Compose / Helm lifecycle).
#
# Usage (from repo root):
#   export BRIDGE_GROUP=team-alpha
#   export TENANT_IDS=tenant-a,tenant-b
#   envsubst < deploy/docker/bridge.docker-compose.yml > /tmp/bridge-${BRIDGE_GROUP}.yml
#   docker compose -f /tmp/bridge-${BRIDGE_GROUP}.yml up -d
# =============================================================================

services:
  commander-bridge:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: production
      args:
        - NODE_ENV=production
    image: ${COMMANDER_IMAGE:-commander-api:latest}
    container_name: commander-bridge-${BRIDGE_GROUP}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DEPLOYMENT_MODEL=bridge
      - BRIDGE_GROUP=${BRIDGE_GROUP}
      - TENANT_IDS=${TENANT_IDS:?TENANT_IDS is required (comma-separated tenant IDs)}
      - TENANT_CONFIG_PATH=/app/config/tenants.json
      - COMMANDER_DATA_ROOT=/data
      - COMMANDER_API_KEY=${COMMANDER_API_KEY:?COMMANDER_API_KEY is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Tenant API keys. Supplied through the environment rather than a bind
      # mount: the runtime file is created on first use, so mounting a
      # repository-relative path would fail on a fresh clone.
      - TENANT_API_KEYS=${TENANT_API_KEYS:-}
    volumes:
      # Shared tenant registry (read-only at runtime)
      - ../../config/tenants.json:/app/config/tenants.json:ro
      # Shared bridge volume; each tenant writes to /data/bridge/<tenantId>
      - bridge-data-${BRIDGE_GROUP}:/data/bridge
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bridge-data-${BRIDGE_GROUP}:
    driver: local
