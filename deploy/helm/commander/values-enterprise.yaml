# Enterprise cell profile — external Postgres + existingSecrets only.
tier: enterprise

image:
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

tenantAuthority:
  configurationSha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  apiProof:
    publicSecret: commander-api-proof-public
    privateSecret: commander-api-proof-private

# Explicit cell tenant for COMMANDER_CELL_TENANT_ID (must match an entry in worker.tenants).
cell:
  tenantId: tenant-a

web:
  enabled: false

worker:
  enabled: true
  replicas: 2
  authTokenSecret: cmdr-worker
  # REQUIRED: replace with this cell's explicit tenant IDs (never '*').
  tenants: tenant-a,tenant-b

kernelOps:
  enabled: true

adapterOps:
  enabled: true
  reconcileIntervalMs: 10000
  compensationIntervalMs: 10000
  # Pod metadata.name is the durable adapter-ops instance identity.
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  secrets:
    existingSecret: cmdr-adapters
  egress:
    allowlist:
      - api.github.com

# Operator-supplied Ed25519 PEM + JWKS (existingSecret refs only; never chart-generated).
capability:
  existingSecret: cmdr-capability
  create: false

evidenceSigning:
  existingSecret: cmdr-evidence-signing
  create: false

database:
  enabled: true
  backend: postgres
  postgres:
    bundled: false
    existingSecret: cmdr-db

databaseTls:
  caSecret: commander-database-public-ca
  expectedServerSpkiSha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

networkPolicy:
  enabled: true
  # Replace this documentation address with the literal /32 or /128 reached by
  # all six TLS DSNs, or use one or more exact Kubernetes Service tuples.
  databaseEndpoints:
    - roles: [owner, app, tenant-authority, scheduler, worker, adapter-ops]
      cidr:
        cidr: 10.0.0.0/32
        port: 5432
  egress:
    adapterCidrs: []
    databaseCidrs:
      - 10.0.0.0/32

sandboxd:
  enabled: false

persistence:
  enabled: false

api:
  secrets:
    existingSecret: cmdr-api
