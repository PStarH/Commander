# Demo cell profile — bundled Postgres, all cell components enabled.
# DEV ONLY: secrets created by chart for local/kind smoke. Do not use in production.
tier: demo

# Explicit cell tenant for COMMANDER_CELL_TENANT_ID (matches worker.tenants first entry).
cell:
  tenantId: local

web:
  enabled: false

worker:
  enabled: true
  replicas: 2
  authTokenSecret: ''
  tenants: local

kernelOps:
  enabled: true

adapterOps:
  enabled: true
  # Pod metadata.name is the durable adapter-ops instance identity.
  replicas: 1
  secrets:
    create: true

# DEV ONLY: chart-created ephemeral Ed25519 materials for local/kind smoke.
capability:
  create: true

evidenceSigning:
  create: true

database:
  enabled: true
  backend: postgres
  postgres:
    bundled: true
    persistence:
      enabled: false
    password: ''
    existingSecret: ''

databaseTls:
  existingSecret: commander-database-tls
  expectedServerSpkiSha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

image:
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

tenantAuthority:
  configurationSha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  apiProof:
    publicSecret: commander-api-proof-public
    privateSecret: commander-api-proof-private

networkPolicy:
  enabled: true
  databaseEndpoints:
    - roles: [owner, app, tenant-authority, scheduler, worker, adapter-ops]
      service:
        namespace: default
        name: commander-postgres
        servicePort: 5432
        targetPort: 5432
        podSelector:
          app.kubernetes.io/name: commander
          app.kubernetes.io/instance: commander
          app.kubernetes.io/component: postgres

sandboxd:
  enabled: false

api:
  secrets:
    create: true

persistence:
  enabled: false
