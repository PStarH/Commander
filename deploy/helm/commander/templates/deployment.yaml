{{- if not .Values.tenantAuthority.transportBootstrap }}
# =============================================================================
# Commander API — Deployment
# =============================================================================
{{- include "commander.requireEnterpriseSecrets" . }}
{{- include "commander.requireLifecycleValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "commander.fullname" . }}-api
  annotations:
    commander.io/tenant-context-aware: "true"
    commander.io/tenant-authority-phase: {{ .Values.tenantAuthority.cutoverPhase | quote }}
    commander.io/tenant-authority-image-digest: {{ .Values.image.digest | quote }}
    commander.io/tenant-authority-configuration-sha256: {{ .Values.tenantAuthority.configurationSha256 | quote }}
  labels:
    {{- include "commander.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "commander.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        commander.io/tenant-context-aware: "true"
        commander.io/tenant-authority-phase: {{ .Values.tenantAuthority.cutoverPhase | quote }}
        commander.io/tenant-authority-image-digest: {{ .Values.image.digest | quote }}
        commander.io/tenant-authority-configuration-sha256: {{ .Values.tenantAuthority.configurationSha256 | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "commander.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: api-runtime-state
          image: {{ include "commander.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "-e"]
          args:
            - |
              const fs = require('node:fs');
              const directory = '/tmp/commander-api';
              fs.mkdirSync(directory, { recursive: true, mode: 0o700 });
              fs.chownSync(directory, {{ .Values.podSecurityContext.runAsUser }}, {{ .Values.podSecurityContext.runAsGroup }});
              fs.chmodSync(directory, 0o700);
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- if include "commander.postgresBackend" . }}
        - name: api-proof-tls-materialize
          image: {{ include "commander.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "-e"]
          args:
            - |
              const fs = require('node:fs');
              const files = [['tls.crt', 0o444], ['tls.key', 0o400]];
              for (const [name, mode] of files) {
                const source = `/source/api-proof/${name}`;
                const target = `/runtime/api-proof/${name}`;
                fs.copyFileSync(source, target, fs.constants.COPYFILE_EXCL);
                fs.chownSync(target, {{ .Values.podSecurityContext.runAsUser }}, {{ .Values.podSecurityContext.runAsGroup }});
                fs.chmodSync(target, mode);
                const stat = fs.lstatSync(target);
                if (!stat.isFile() || stat.isSymbolicLink() || stat.mode % 512 !== mode) process.exit(1);
              }
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: api-proof-private-source
              mountPath: /source/api-proof
              readOnly: true
            - name: api-proof-tls-runtime
              mountPath: /runtime/api-proof
        {{- include "commander.runtimeMigrationGate" (dict "root" . "key" (include "commander.databaseAppSecretKey" .)) | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "commander.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
            - name: tenant-proof
              containerPort: {{ .Values.tenantAuthority.apiProof.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv | quote }}
            {{- include "commander.profileTierEnv" . | nindent 12 }}
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: COMMANDER_TENANT_AUTHORITY_IMAGE_DIGEST
              value: {{ .Values.image.digest | quote }}
            - name: COMMANDER_TENANT_AUTHORITY_CONFIGURATION_SHA256
              value: {{ .Values.tenantAuthority.configurationSha256 | quote }}
            - name: COMMANDER_TENANT_AUTHORITY_CUTOVER_PHASE
              value: {{ .Values.tenantAuthority.cutoverPhase | quote }}
            {{- if include "commander.postgresBackend" . }}
            - name: COMMANDER_TENANT_AUTHORITY_PROOF_PORT
              value: {{ .Values.tenantAuthority.apiProof.port | quote }}
            - name: COMMANDER_TENANT_AUTHORITY_PROOF_CERT_FILE
              value: /run/commander/api-proof/tls.crt
            - name: COMMANDER_TENANT_AUTHORITY_PROOF_KEY_FILE
              value: /run/commander/api-proof/tls.key
            - name: COMMANDER_TENANT_AUTHORITY_PROOF_DNS_NAME
              value: {{ printf "%s-api-proof.%s.svc.cluster.local" (include "commander.fullname" .) .Release.Namespace | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.config.corsOrigins | quote }}
            - name: API_STORE_BACKEND
              value: {{ include "commander.apiStoreBackend" . | quote }}
            # Legacy stores are non-authoritative; /v1 durability remains in the kernel.
            - name: COMMANDER_WARROOM_FILE
              value: /tmp/commander-api/war-room.json
            - name: COMMANDER_AGENT_STATE_FILE
              value: /tmp/commander-api/agent-state.json
            - name: COMMANDER_ACTION_RATIONALE_FILE
              value: /tmp/commander-api/action-rationales.json
            - name: API_RATE_LIMIT_DB_PATH
              value: /tmp/commander-api/rate-limit.sqlite
            - name: COMMANDER_TRACE_DIR
              value: /tmp/commander-api/traces
            {{- if include "commander.postgresBackend" . }}
            - name: COMMANDER_MEMORY_STORE
              value: in-memory
            - name: COMMANDER_KERNEL_ENABLED
              value: "1"
            - name: COMMANDER_KERNEL_BACKEND
              value: postgres
            {{- end }}
            - name: API_RATE_LIMIT
              value: {{ .Values.config.rateLimitPerMinute | quote }}
            - name: TENANT_PROVIDER
              value: {{ .Values.config.tenantProvider | quote }}
            {{- if .Values.api.secrets.existingSecret }}
            - name: COMMANDER_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.existingSecret | quote }}
                  key: master-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.existingSecret | quote }}
                  key: jwt-secret
            - name: COMMANDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.existingSecret | quote }}
                  key: api-key
            - name: COMMANDER_CAPABILITY_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.existingSecret | quote }}
                  key: capability-token-key
            - name: COMMANDER_INTEGRITY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.existingSecret | quote }}
                  key: integrity-key
            {{- else if and .Values.api.secrets.create (not .Values.api.secrets.existingSecret) (eq .Values.tier "demo") }}
            - name: COMMANDER_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.apiSecretName" . | quote }}
                  key: master-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.apiSecretName" . | quote }}
                  key: jwt-secret
            - name: COMMANDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.apiSecretName" . | quote }}
                  key: api-key
            - name: COMMANDER_CAPABILITY_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.apiSecretName" . | quote }}
                  key: capability-token-key
            - name: COMMANDER_INTEGRITY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.apiSecretName" . | quote }}
                  key: integrity-key
            {{- else }}
            {{- if .Values.api.secrets.masterKeySecret }}
            - name: COMMANDER_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.masterKeySecret | quote }}
                  key: master-key
            {{- end }}
            {{- if .Values.api.secrets.jwtSecretSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.jwtSecretSecret | quote }}
                  key: jwt-secret
            {{- end }}
            {{- if .Values.api.secrets.apiKeySecret }}
            - name: COMMANDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.apiKeySecret | quote }}
                  key: api-key
            {{- end }}
            {{- if .Values.api.secrets.capabilityTokenKeySecret }}
            - name: COMMANDER_CAPABILITY_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.capabilityTokenKeySecret | quote }}
                  key: capability-token-key
            {{- end }}
            {{- if .Values.api.secrets.integrityKeySecret }}
            - name: COMMANDER_INTEGRITY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.integrityKeySecret | quote }}
                  key: integrity-key
            {{- end }}
            {{- end }}
            {{- if .Values.llm.openaiApiKeySecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.openaiApiKeySecret }}
                  key: api-key
            {{- end }}
            {{- if .Values.llm.anthropicApiKeySecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.anthropicApiKeySecret }}
                  key: api-key
            {{- end }}
            {{- if .Values.llm.googleApiKeySecret }}
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.googleApiKeySecret }}
                  key: api-key
            {{- end }}
            {{- if .Values.llm.provider }}
            - name: COMMANDER_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            {{- end }}
            {{- if .Values.llm.model }}
            - name: COMMANDER_MODEL
              value: {{ .Values.llm.model | quote }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: redis://{{ include "commander.fullname" . }}-redis:{{ .Values.redis.port }}
            {{- end }}
            {{- if include "commander.postgresBackend" . }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.databaseUrlSecretName" . | quote }}
                  key: {{ include "commander.databaseAppSecretKey" . | quote }}
            - name: COMMANDER_KERNEL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.databaseUrlSecretName" . | quote }}
                  key: {{ include "commander.databaseAppSecretKey" . | quote }}
            - name: COMMANDER_TENANT_AUTHORITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.databaseUrlSecretName" . | quote }}
                  key: {{ include "commander.databaseTenantAuthoritySecretKey" . | quote }}
            {{- include "commander.databaseTlsEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.observability.otel.enabled }}
            - name: OTEL_EXPORTER_ENDPOINT
              value: {{ .Values.observability.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.observability.otel.serviceName | quote }}
            {{- end }}
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "commander.cellSecurityContext" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.health.livenessPath }}
              port: http
            failureThreshold: {{ .Values.api.health.startupFailureThreshold }}
            periodSeconds: {{ .Values.api.health.startupPeriodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.health.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.api.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.health.periodSeconds }}
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - >-
                  const https = require('node:https');
                  const req = https.get({ hostname: '127.0.0.1', port: {{ .Values.tenantAuthority.apiProof.port }}, path: '/ready/tenant-authority/v1', rejectUnauthorized: false }, (res) => process.exit(res.statusCode === 200 ? 0 : 1));
                  req.on('error', () => process.exit(1));
                  req.setTimeout(1500, () => { req.destroy(); process.exit(1); });
            initialDelaySeconds: {{ .Values.api.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.health.periodSeconds }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if include "commander.postgresBackend" . }}
            - name: api-proof-tls-runtime
              mountPath: /run/commander/api-proof
              readOnly: true
            {{- include "commander.databaseTlsVolumeMount" . | nindent 12 }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: commander-state
              mountPath: /app/.commander_state
            - name: commander-traces
              mountPath: /app/.commander_traces
            - name: commander-memory
              mountPath: /app/.commander_memory
            - name: commander-results
              mountPath: /app/.commander_results
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if include "commander.postgresBackend" . }}
        - name: api-proof-private-source
          secret:
            secretName: {{ .Values.tenantAuthority.apiProof.privateSecret | quote }}
            items:
              - key: {{ .Values.tenantAuthority.apiProof.certKey | quote }}
                path: tls.crt
                mode: 292
              - key: {{ .Values.tenantAuthority.apiProof.keyKey | quote }}
                path: tls.key
                mode: 256
        - name: api-proof-tls-runtime
          emptyDir: {}
        {{- include "commander.databaseTlsVolume" . | nindent 8 }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: commander-state
          persistentVolumeClaim:
            claimName: {{ include "commander.fullname" . }}-state
        - name: commander-traces
          persistentVolumeClaim:
            claimName: {{ include "commander.fullname" . }}-traces
        - name: commander-memory
          persistentVolumeClaim:
            claimName: {{ include "commander.fullname" . }}-memory
        - name: commander-results
          persistentVolumeClaim:
            claimName: {{ include "commander.fullname" . }}-results
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
