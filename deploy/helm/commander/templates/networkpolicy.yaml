# =============================================================================
# Commander — Network Policy (Enterprise tier)
# =============================================================================
{{- define "commander.databaseEndpointEgress" -}}
{{- $root := .root -}}
{{- $roles := .roles -}}
{{- range $endpoint := $root.Values.networkPolicy.databaseEndpoints -}}
{{- $selected := false -}}
{{- range $role := $roles -}}
{{- if has $role $endpoint.roles -}}{{- $selected = true -}}{{- end -}}
{{- end -}}
{{- if $selected }}
- to:
  {{- if $endpoint.cidr }}
    - ipBlock:
        cidr: {{ $endpoint.cidr.cidr | quote }}
  ports:
    - protocol: TCP
      port: {{ $endpoint.cidr.port }}
  {{- else }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $endpoint.service.namespace | quote }}
      podSelector:
        matchLabels:
          {{- toYaml $endpoint.service.podSelector | nindent 10 }}
  ports:
    - protocol: TCP
      port: {{ $endpoint.service.targetPort }}
  {{- end }}
{{- end -}}
{{- end -}}
{{- end -}}

{{- define "commander.clusterDnsEgress" -}}
- to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.clusterDns.namespace | quote }}
      podSelector:
        matchLabels:
          {{- toYaml .Values.networkPolicy.clusterDns.podSelector | nindent 10 }}
  ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
{{- end -}}

{{- if not .Values.tenantAuthority.transportBootstrap }}
{{- if .Values.redis.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-redis
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "commander.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ .Values.redis.port }}
{{- end }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-api
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    {{- if or .Values.web.enabled .Values.networkPolicy.ingressControllerNamespace }}
    - from:
        {{- if .Values.web.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
        {{- end }}
        {{- with .Values.networkPolicy.ingressControllerNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}

    {{- else }}
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
    {{- end }}

---
# Dedicated tenant-authority proof ingress. It intentionally never permits the
# normal API HTTP port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-api-proof-ingress
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "commander.proofReaderLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.tenantAuthority.apiProof.port }}

{{- if .Values.networkPolicy.enabled }}
---
# Default deny all ingress and egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-default-deny
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow ingress to API from the same namespace and the ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-api-ingress
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- with .Values.networkPolicy.ingressControllerNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}

---
# Allow API egress to DNS, PostgreSQL, and Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-api-egress
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Egress
  egress:
    # DNS
    {{- include "commander.clusterDnsEgress" . | nindent 4 }}
    # PostgreSQL app and tenant-authority roles.
    {{- include "commander.databaseEndpointEgress" (dict "root" . "roles" (list "app" "tenant-authority")) | nindent 4 }}
    # Redis
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "commander.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: {{ .Values.redis.port }}
    {{- end }}

---
# The proof Job has no Service and no ingress. It may resolve cluster DNS,
# reach sealed database endpoints, and call only the dedicated proof listener.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-tenant-cutover-prove
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commander.proofReaderLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Read-only Kubernetes topology API used by the projected proof-reader identity.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              component: kube-apiserver
      ports:
        - protocol: TCP
          port: 6443
    {{- range .Values.networkPolicy.egress.kubernetesApiCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "commander.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ .Values.tenantAuthority.apiProof.port }}
    {{- include "commander.databaseEndpointEgress" (dict "root" . "roles" (list "owner")) | nindent 4 }}

---
# Allow worker egress to PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-worker-egress
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    # DNS
    {{- include "commander.clusterDnsEgress" . | nindent 4 }}
    {{- include "commander.databaseEndpointEgress" (dict "root" . "roles" (list "worker")) | nindent 4 }}
    {{- range .Values.networkPolicy.egress.adapterCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- range .Values.networkPolicy.egress.kubernetesApiCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.adapterOps.kubernetes.apiPort }}
    {{- end }}
---
# Allow kernel-ops egress to PostgreSQL + DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-kernel-ops-egress
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kernel-ops
  policyTypes:
    - Egress
  egress:
    {{- include "commander.clusterDnsEgress" . | nindent 4 }}
    {{- include "commander.databaseEndpointEgress" (dict "root" . "roles" (list "scheduler")) | nindent 4 }}

---
# Allow adapter-ops egress to PostgreSQL, DNS, and adapter CIDR allowlist
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-adapter-ops-egress
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: adapter-ops
  policyTypes:
    - Egress
  egress:
    {{- include "commander.clusterDnsEgress" . | nindent 4 }}
    {{- include "commander.databaseEndpointEgress" (dict "root" . "roles" (list "adapter-ops")) | nindent 4 }}
    {{- range .Values.networkPolicy.egress.adapterCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- range .Values.networkPolicy.egress.kubernetesApiCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.adapterOps.kubernetes.apiPort }}
    {{- end }}

---
# Allow ingress to bundled PostgreSQL from cell components
{{- if include "commander.bundledPostgres" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-postgres-ingress
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "commander.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              {{- include "commander.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
        - podSelector:
            matchLabels:
              {{- include "commander.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: kernel-ops
        - podSelector:
            matchLabels:
              {{- include "commander.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: adapter-ops
        - podSelector:
            matchLabels:
              {{- include "commander.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: migration
        - podSelector:
            matchLabels:
              {{- include "commander.proofReaderLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.database.postgres.port }}
{{- end }}

---
# Allow migration Job egress to PostgreSQL and DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commander.fullname" . }}-migration-egress
  labels:
    {{- include "commander.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migration
  policyTypes:
    - Egress
  egress:
    {{- include "commander.clusterDnsEgress" . | nindent 4 }}
    {{- include "commander.databaseEndpointEgress" (dict "root" . "roles" (list "owner" "app" "tenant-authority" "scheduler" "worker" "adapter-ops")) | nindent 4 }}
{{- end }}
{{- end }}
