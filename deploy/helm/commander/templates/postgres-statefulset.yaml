# =============================================================================
# Commander — PostgreSQL StatefulSet (optional built-in database)
# =============================================================================
{{- if include "commander.bundledPostgres" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "commander.fullname" . }}-postgres
  labels:
    {{- include "commander.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "commander.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "commander.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "commander.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
      annotations:
        commander.io/database-transport-content-sha256: {{ printf "%s\000%s\000%s\000%s\000%s\0000440\000ssl=on\000ssl_ca_file=/run/commander/database-tls/ca.crt\000ssl_cert_file=/run/commander/database-tls/tls.crt\000ssl_key_file=/run/commander/database-tls/tls.key\000postgres-data:/var/lib/postgresql/data" .Values.databaseTls.existingSecret .Values.databaseTls.caKey .Values.databaseTls.certKey .Values.databaseTls.keyKey (ternary "pvc" "emptyDir" .Values.database.postgres.persistence.enabled) | sha256sum | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.database.postgres.image.repository }}:{{ .Values.database.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -c
            - ssl=on
            - -c
            - ssl_ca_file=/run/commander/database-tls/ca.crt
            - -c
            - ssl_cert_file=/run/commander/database-tls/tls.crt
            - -c
            - ssl_key_file=/run/commander/database-tls/tls.key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: {{ .Values.database.postgres.port }}
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.databaseUrlSecretName" . | quote }}
                  key: postgres-password
            - name: POSTGRES_DB
              value: {{ .Values.database.postgres.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: COMMANDER_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.databaseUrlSecretName" . | quote }}
                  key: owner-password
            - name: COMMANDER_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.databaseUrlSecretName" . | quote }}
                  key: app-password
            - name: COMMANDER_TENANT_AUTHORITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.databaseUrlSecretName" . | quote }}
                  key: tenant-authority-password
            - name: COMMANDER_SCHEDULER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.databaseUrlSecretName" . | quote }}
                  key: scheduler-password
            - name: COMMANDER_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.databaseUrlSecretName" . | quote }}
                  key: worker-password
            - name: COMMANDER_ADAPTER_OPS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "commander.databaseUrlSecretName" . | quote }}
                  key: adapter-ops-password
          resources: {{ toYaml .Values.database.postgres.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.postgres.user | quote }}
                - -d
                - {{ .Values.database.postgres.database | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.postgres.user | quote }}
                - -d
                - {{ .Values.database.postgres.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: database-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: database-tls
              mountPath: /run/commander/database-tls
              readOnly: true
      volumes:
        - name: database-init
          configMap:
            name: {{ include "commander.fullname" . }}-database-init
            defaultMode: 493
        - name: database-tls
          secret:
            secretName: {{ .Values.databaseTls.existingSecret | quote }}
            defaultMode: 288
            items:
              - key: {{ .Values.databaseTls.caKey | quote }}
                path: ca.crt
              - key: {{ .Values.databaseTls.certKey | quote }}
                path: tls.crt
              - key: {{ .Values.databaseTls.keyKey | quote }}
                path: tls.key
  {{- if .Values.database.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.database.postgres.persistence.size }}
        {{- if .Values.database.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.database.postgres.persistence.storageClass }}
        {{- end }}
  {{- else }}
        - name: postgres-data
          emptyDir: {}
  {{- end }}
{{- end }}
