{{- if not .Values.tenantAuthority.transportBootstrap }}
{{- /* Demo-only stable development evidence keypair. Enterprise references an
     operator-owned Secret and this template does not render. */ -}}
{{- if and (or .Values.worker.enabled .Values.adapterOps.enabled) .Values.evidenceSigning.create (not .Values.evidenceSigning.existingSecret) (eq .Values.tier "demo") }}
{{- $secretName := include "commander.evidenceSigningSecretName" . }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $privateKeyPem := "-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIBnH+WgGi4aJ/UkAwsT3K0UsqByiyXdHUJ5kcVoD4QfC\n-----END PRIVATE KEY-----\n" }}
{{- $keyId := "demo-evidence-ed25519" }}
{{- $jwksJson := "{\"keys\":[{\"kty\":\"OKP\",\"crv\":\"Ed25519\",\"x\":\"su9CvxEJ4qMQTg3r9HHGm71ceXzPmh7fZgRQbOFQ6m0\",\"kid\":\"demo-evidence-ed25519\",\"alg\":\"EdDSA\",\"use\":\"sig\"}]}" }}
{{- if and $secret $secret.data }}
{{- if index $secret.data "private-key-pem" }}{{- $privateKeyPem = index $secret.data "private-key-pem" | b64dec }}{{- end }}
{{- if index $secret.data "key-id" }}{{- $keyId = index $secret.data "key-id" | b64dec }}{{- end }}
{{- if index $secret.data "jwks-json" }}{{- $jwksJson = index $secret.data "jwks-json" | b64dec }}{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "commander.labels" . | nindent 4 }}
  annotations:
    commander.io/evidence-signing-key: "demo-dev-fixed-pair"
    commander.io/not-for-production: "true"
type: Opaque
stringData:
  {{ include "commander.evidenceSigningPrivateKeyPemKey" . }}: {{ $privateKeyPem | quote }}
  {{ include "commander.evidenceSigningKeyIdKey" . }}: {{ $keyId | quote }}
  {{ include "commander.evidenceSigningJwksJsonKey" . }}: {{ $jwksJson | quote }}
{{- end }}
{{- end }}
