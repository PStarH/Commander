services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fixture
      POSTGRES_PASSWORD: ${FIXTURE_POSTGRES_PASSWORD:?FIXTURE_POSTGRES_PASSWORD is required}
      POSTGRES_USER: fixture_bootstrap
      FIXTURE_OWNER_PASSWORD: ${FIXTURE_OWNER_PASSWORD:?FIXTURE_OWNER_PASSWORD is required}
      FIXTURE_APP_PASSWORD: ${FIXTURE_APP_PASSWORD:?FIXTURE_APP_PASSWORD is required}
      FIXTURE_TENANT_AUTHORITY_PASSWORD: ${FIXTURE_TENANT_AUTHORITY_PASSWORD:?FIXTURE_TENANT_AUTHORITY_PASSWORD is required}
      FIXTURE_SCHEDULER_PASSWORD: ${FIXTURE_SCHEDULER_PASSWORD:?FIXTURE_SCHEDULER_PASSWORD is required}
      FIXTURE_WORKER_PASSWORD: ${FIXTURE_WORKER_PASSWORD:?FIXTURE_WORKER_PASSWORD is required}
      FIXTURE_ADAPTER_OPS_PASSWORD: ${FIXTURE_ADAPTER_OPS_PASSWORD:?FIXTURE_ADAPTER_OPS_PASSWORD is required}
    entrypoint: ["/fixture/postgres-entrypoint.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server-tls/tls.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server-tls/tls.key
      - -c
      - ssl_ca_file=/var/lib/postgresql/server-tls/ca.crt
      - -c
      - ssl_min_protocol_version=TLSv1.3
    ports:
      - "127.0.0.1:${DIRECT_PORT:-55432}:5432"
    volumes:
      - "${FIXTURE_STATE_DIR:?FIXTURE_STATE_DIR is required}:/fixture-certs:ro"
      - ./postgres-entrypoint.sh:/fixture/postgres-entrypoint.sh:ro
      - ./fixture-role-init.sh:/docker-entrypoint-initdb.d/10-fixture-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture_bootstrap -d fixture"]
      interval: 1s
      timeout: 3s
      retries: 30
