# Commander Web GUI — Nginx configuration
#
# This server is the ONLY path from the browser to the API in a deployed stack:
# docker-compose.prod.yml publishes no host port for the api service (only the
# 9443 tenant-authority proof port, on the compose network). The bundle is built
# with an empty VITE_API_BASE_URL (apps/web/Dockerfile), so every client call is
# relative and lands here — the route prefixes below must stay in sync with
# apps/web/vite.config.ts (dev proxy) and the bare paths used by the client
# (src/api.ts, src/hooks/useWarRoom.ts, src/pages/ChatPage.tsx).

# Upgrade only when the client asked for it; plain requests (including SSE
# streams) get a normal `Connection: close` to the upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── Security headers ──────────────────────────────────────────────────────
    # Security: Per OWASP Secure Headers Cheat Sheet — set CSP, frame-ancestors,
    # content-type, referrer, permissions policies. X-XSS-Protection is deprecated
    # (set to 0, rely on CSP instead).
    #
    # `connect-src 'self'` is the reason the bundle must never carry an absolute
    # API origin: same-origin proxying (below) is what keeps every fetch legal.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Shared proxy settings ─────────────────────────────────────────────────
    # Every proxy_pass in this server targets the same API container, so the
    # common behaviour is set once and inherited by the locations below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ── API: /api/* ───────────────────────────────────────────────────────────
    # `POST /api/chat?stream=true` streams an SSE body (src/api.ts), so buffering
    # must be off or the browser receives nothing until the response completes.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API: /projects/* ──────────────────────────────────────────────────────
    # `${API_BASE}/projects/${PROJECT_ID}/...` (src/api.ts, useWarRoom.ts).
    # `GET /projects/<id>/events` is a long-lived SSE stream (ChatPage.tsx via
    # src/lib/authenticatedEventStream.ts) — buffering off for the same reason.
    location /projects/ {
        proxy_pass http://api:4000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API: /runtime/* ───────────────────────────────────────────────────────
    # `${API_BASE}/runtime/{active,pause,resume,rollback}` (src/api.ts).
    location /runtime/ {
        proxy_pass http://api:4000;
    }

    # ── API: /a2a/* and /mcp/* ────────────────────────────────────────────────
    # Proxied by the dev config (vite.config.ts); agent-to-agent and MCP routes
    # are mounted at the API root.
    location /a2a/ {
        proxy_pass http://api:4000;
    }

    location /mcp/ {
        proxy_pass http://api:4000;
    }

    # ── API: ops + versioned endpoints ────────────────────────────────────────
    # Root-mounted by apps/api/src/index.ts: /health, /health/detailed, /ready,
    # /metrics, /system/status, /v1/health, /v1/openapi.json.
    location /health {
        proxy_pass http://api:4000;
    }

    location = /ready {
        proxy_pass http://api:4000;
    }

    location = /metrics {
        proxy_pass http://api:4000;
    }

    location /system/ {
        proxy_pass http://api:4000;
    }

    location /v1/ {
        proxy_pass http://api:4000;
    }

    # NOTE: /missions is deliberately NOT proxied. It is a client-side page route
    # (`<Route path="/missions">` in src/App.tsx) and the dev config proxies it
    # only for a bare API path the client never calls; proxying it here would
    # break a hard reload of the Missions page. Mission data is served under
    # /projects/<id>/missions/..., which is covered above.

    # Static assets with cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — every unmatched route is a client-side page route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
