apiVersion: v1
kind: Namespace
metadata:
  name: external-db
---
apiVersion: v1
kind: Secret
metadata:
  name: external-postgres-password
  namespace: external-db
type: Opaque
stringData:
  password: external-password-not-for-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-postgres
  namespace: external-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: external-postgres-password
                  key: password
            - name: POSTGRES_DB
              value: commander
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: external-postgres
  namespace: external-db
spec:
  selector:
    app.kubernetes.io/name: external-postgres
  ports:
    - port: 5432
      targetPort: 5432
