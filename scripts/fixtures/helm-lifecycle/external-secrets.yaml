apiVersion: v1
kind: Secret
metadata:
  name: external-database-urls
  namespace: commander-lifecycle
type: Opaque
stringData:
  owner-url: postgres://owner:external-password-not-for-production@external-postgres.external-db.svc.cluster.local:5432/commander?sslmode=require
  app-url: postgres://app:external-password-not-for-production@external-postgres.external-db.svc.cluster.local:5432/commander?sslmode=require
  tenant-authority-url: postgres://tenant_authority:external-password-not-for-production@external-postgres.external-db.svc.cluster.local:5432/commander?sslmode=require
  scheduler-url: postgres://scheduler:external-password-not-for-production@external-postgres.external-db.svc.cluster.local:5432/commander?sslmode=require
  worker-url: postgres://worker:external-password-not-for-production@external-postgres.external-db.svc.cluster.local:5432/commander?sslmode=require
  adapter-ops-url: postgres://adapter_ops:external-password-not-for-production@external-postgres.external-db.svc.cluster.local:5432/commander?sslmode=require
---
