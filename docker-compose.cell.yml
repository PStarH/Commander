# =============================================================================
# Commander — Cell profile override (L4-07)
# Usage:
#   export COMMANDER_API_KEY="$(openssl rand -hex 32)"
#   export POSTGRES_PASSWORD="$(openssl rand -hex 16)"
#   export COMMANDER_MASTER_KEY=… JWT_SECRET=… COMMANDER_CAPABILITY_TOKEN_KEY=…
#   export COMMANDER_CAPABILITY_PRIVATE_KEY_PEM=… COMMANDER_CAPABILITY_KEY_ID=…
#   export COMMANDER_CAPABILITY_JWKS_JSON=…   # worker/adapter Ed25519 authority
#   export COMMANDER_INTEGRITY_KEY=… COMMANDER_WORKER_AUTH_TOKEN=…
#   # Optional: DOCKER_GID — worker entrypoint auto-aligns to docker.sock GID.
#   # Override only if you need compose group_add without rebuilding the image:
#   #   export DOCKER_GID=$(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock alpine stat -c %g /var/run/docker.sock)
#   pnpm cell:up-assert -- --keep  # generates ephemeral database TLS material
#
# Authority mapping (bench role passwords; see deploy/docker/postgres-init.bench.sql):
#   kernel-migrate → commander_owner
#   api            → commander_app
#   kernel-ops     → commander_scheduler
#   worker → commander_worker; adapter-ops → commander_adapter_ops

volumes:
  adapter-ops-claim-secrets:
  postgres-tls-runtime:
  database-ca-runtime:
# Worker tenant default for cell: local (override via COMMANDER_WORKER_TENANTS).
# =============================================================================

services:
  redis:
    profiles:
      - cell

  cell-tls-materialize:
    image: postgres:16-alpine
    user: '0:0'
    network_mode: none
    read_only: true
    restart: 'no'
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    entrypoint: ['/bin/sh', '-euc']
    command:
      - |
        umask 077
        install -d -o 70 -g 70 -m 0700 /runtime/postgres
        install -o 70 -g 70 -m 0444 /source/ca.crt /runtime/postgres/ca.crt
        install -o 70 -g 70 -m 0444 /source/tls.crt /runtime/postgres/tls.crt
        install -o 70 -g 70 -m 0400 /source/tls.key /runtime/postgres/tls.key
        install -d -o 0 -g 0 -m 0755 /runtime/database-ca
        install -o 0 -g 0 -m 0444 /source/ca.crt /runtime/database-ca/ca.crt
    volumes:
      - ${COMMANDER_CELL_DATABASE_TLS_CA_HOST_FILE:?set COMMANDER_CELL_DATABASE_TLS_CA_HOST_FILE}:/source/ca.crt:ro
      - ${COMMANDER_CELL_DATABASE_TLS_CERT_HOST_FILE:?set COMMANDER_CELL_DATABASE_TLS_CERT_HOST_FILE}:/source/tls.crt:ro
      - ${COMMANDER_CELL_DATABASE_TLS_KEY_HOST_FILE:?set COMMANDER_CELL_DATABASE_TLS_KEY_HOST_FILE}:/source/tls.key:ro
      - postgres-tls-runtime:/runtime/postgres
      - database-ca-runtime:/runtime/database-ca
    profiles:
      - cell

  postgres:
    command:
      - -c
      - ssl=on
      - -c
      - ssl_ca_file=/run/commander/postgres-tls/ca.crt
      - -c
      - ssl_cert_file=/run/commander/postgres-tls/tls.crt
      - -c
      - ssl_key_file=/run/commander/postgres-tls/tls.key
    depends_on:
      cell-tls-materialize:
        condition: service_completed_successfully
    volumes:
      - postgres-tls-runtime:/run/commander/postgres-tls:ro
    profiles:
      - cell

  kernel-migrate:
    profiles:
      - cell
    entrypoint: ['/bin/sh', '-euc']
    command:
      - |
        COMMANDER_TENANT_AUTHORITY_CUTOVER_PHASE=enforce node packages/kernel/dist/migrate.js tenant-cutover-migrate
        node packages/kernel/dist/migrate.js
    environment:
      # Hardcoded role DSNs — block host DATABASE_URL / COMMANDER_KERNEL_DATABASE_URL bleed.
      - DATABASE_URL=postgres://commander_owner:commander_owner@postgres:5432/commander?sslmode=verify-full
      - COMMANDER_KERNEL_DATABASE_URL=postgres://commander_owner:commander_owner@postgres:5432/commander?sslmode=verify-full
      - COMMANDER_DATABASE_TLS_CA_FILE=/run/commander/database-tls/ca.crt
      - COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256=${COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256:?set COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256}
      # The owner migration is also responsible for seeding the explicit worker
      # tenant allowlist before worker/adapter LOGINs register.
      - COMMANDER_WORKER_TENANTS=${COMMANDER_WORKER_TENANTS:-${COMMANDER_CELL_TENANT_ID:-local}}
      - COMMANDER_WORKER_ALLOWED_TENANTS=${COMMANDER_WORKER_ALLOWED_TENANTS:-${COMMANDER_WORKER_TENANTS:-${COMMANDER_CELL_TENANT_ID:-local}}}
      - COMMANDER_ADAPTER_OPS_PASSWORD=${COMMANDER_ADAPTER_OPS_PASSWORD:-commander_adapter_ops}
      # Owner-only policy seed for the explicit demo adapter; worker remains read-only.
      - COMMANDER_ENABLE_DEMO_TICKET=${COMMANDER_ENABLE_DEMO_TICKET:-}
    volumes:
      - database-ca-runtime:/run/commander/database-tls:ro

  api:
    profiles:
      - cell
    environment:
      # Legacy /api stores are frozen presentation compatibility, not /v1 authority.
      # Keep their runtime DDL away from the least-privilege commander_app role.
      - API_STORE_BACKEND=memory
      - COMMANDER_MEMORY_STORE=in-memory
      - COMMANDER_KERNEL_ENABLED=1
      - COMMANDER_KERNEL_BACKEND=postgres
      - COMMANDER_ENABLE_DEMO_TICKET=${COMMANDER_ENABLE_DEMO_TICKET:-}
      - API_KEYS=${API_KEYS:-}
      - TENANT_API_KEYS=${TENANT_API_KEYS:-}
      - COMMANDER_CELL_TENANT_ID=${COMMANDER_CELL_TENANT_ID:-local}
      - COMMANDER_DEFAULT_TENANT_ID=${COMMANDER_DEFAULT_TENANT_ID:-${COMMANDER_CELL_TENANT_ID:-local}}
      - DATABASE_URL=postgres://commander_app:commander_app@postgres:5432/commander?sslmode=verify-full
      - COMMANDER_KERNEL_DATABASE_URL=postgres://commander_app:commander_app@postgres:5432/commander?sslmode=verify-full
      - COMMANDER_TENANT_AUTHORITY_DATABASE_URL=postgres://commander_tenant_authority:commander_tenant_authority@postgres:5432/commander?sslmode=verify-full
      - COMMANDER_TENANT_AUTHORITY_CUTOVER_PHASE=enforce
      - COMMANDER_TENANT_CONTEXT_PHASE=enforce
      - COMMANDER_DATABASE_TLS_CA_FILE=/run/commander/database-tls/ca.crt
      - COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256=${COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256:?set COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256}
      - AUTH_FAILURE_REDIS_URL=redis://redis:6379
      - COMMANDER_MASTER_KEY=${COMMANDER_MASTER_KEY:?set COMMANDER_MASTER_KEY}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      # API legacy HMAC path (not worker/adapter authority).
      - COMMANDER_CAPABILITY_TOKEN_KEY=${COMMANDER_CAPABILITY_TOKEN_KEY:?set COMMANDER_CAPABILITY_TOKEN_KEY}
      - COMMANDER_INTEGRITY_KEY=${COMMANDER_INTEGRITY_KEY:?set COMMANDER_INTEGRITY_KEY}
    volumes:
      - database-ca-runtime:/run/commander/database-tls:ro
    depends_on:
      kernel-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles:
      - cell
    # Demo cell: sibling Docker sandbox via host engine (not ALLOW_NO_SANDBOX).
    # Entrypoint auto-joins the sock GID; group_add is optional belt-and-suspenders.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - database-ca-runtime:/run/commander/database-tls:ro
    group_add:
      - ${DOCKER_GID:-0}
    user: '0:0'
    environment:
      - DATABASE_URL=${COMMANDER_WORKER_DATABASE_URL:-postgres://commander_worker:commander_worker@postgres:5432/commander?sslmode=verify-full}
      - COMMANDER_KERNEL_DATABASE_URL=${COMMANDER_WORKER_DATABASE_URL:-postgres://commander_worker:commander_worker@postgres:5432/commander?sslmode=verify-full}
      - COMMANDER_DATABASE_TLS_CA_FILE=/run/commander/database-tls/ca.crt
      - COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256=${COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256:?set COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256}
      # Cell / Helm demo tenant scope (explicit; never '*').
      - COMMANDER_WORKER_TENANTS=${COMMANDER_WORKER_TENANTS:-${COMMANDER_CELL_TENANT_ID:-local}}
      - COMMANDER_WORKER_AUTH_TOKEN=${COMMANDER_WORKER_AUTH_TOKEN:?set COMMANDER_WORKER_AUTH_TOKEN}
      - COMMANDER_WORKER_HEALTH_PORT=8083
      - COMMANDER_KERNEL_BACKEND=postgres
      - COMMANDER_ENABLE_DEMO_TICKET=${COMMANDER_ENABLE_DEMO_TICKET:-}
      - COMMANDER_CELL_TENANT_ID=${COMMANDER_CELL_TENANT_ID:-local}
      - COMMANDER_KUBERNETES_CLUSTER=${COMMANDER_KUBERNETES_CLUSTER:-}
      - COMMANDER_KUBERNETES_SERVER=${COMMANDER_KUBERNETES_SERVER:-}
      - COMMANDER_KUBERNETES_TOKEN_ENV=${COMMANDER_KUBERNETES_TOKEN_ENV:-}
      - COMMANDER_KUBERNETES_NAMESPACES=${COMMANDER_KUBERNETES_NAMESPACES:-}
      - COMMANDER_KUBERNETES_BEARER_TOKEN=${COMMANDER_KUBERNETES_BEARER_TOKEN:-}
      - COMMANDER_SANDBOX_ISOLATION=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      # Worker authority: Ed25519 PEM + JWKS (fail-closed; no HMAC capability-token-key).
      - COMMANDER_CAPABILITY_PRIVATE_KEY_PEM=${COMMANDER_CAPABILITY_PRIVATE_KEY_PEM:?set COMMANDER_CAPABILITY_PRIVATE_KEY_PEM}
      - COMMANDER_CAPABILITY_KEY_ID=${COMMANDER_CAPABILITY_KEY_ID:?set COMMANDER_CAPABILITY_KEY_ID}
      - COMMANDER_CAPABILITY_JWKS_JSON=${COMMANDER_CAPABILITY_JWKS_JSON:?set COMMANDER_CAPABILITY_JWKS_JSON}
      - COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM=${COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM:?set COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM}
      - COMMANDER_EVIDENCE_SIGNING_KEY_ID=${COMMANDER_EVIDENCE_SIGNING_KEY_ID:?set COMMANDER_EVIDENCE_SIGNING_KEY_ID}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8083/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  kernel-ops:
    profiles:
      - cell
    environment:
      - DATABASE_URL=postgres://commander_scheduler:commander_scheduler@postgres:5432/commander?sslmode=verify-full
      - COMMANDER_KERNEL_DATABASE_URL=postgres://commander_scheduler:commander_scheduler@postgres:5432/commander?sslmode=verify-full
      - COMMANDER_DATABASE_TLS_CA_FILE=/run/commander/database-tls/ca.crt
      - COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256=${COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256:?set COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256}
    volumes:
      - database-ca-runtime:/run/commander/database-tls:ro

  adapter-ops:
    build:
      context: .
      dockerfile: packages/adapter-ops/Dockerfile.ops
    environment:
      - NODE_ENV=production
      - COMMANDER_KERNEL_BACKEND=postgres
      - DATABASE_URL=${COMMANDER_ADAPTER_OPS_DATABASE_URL:-postgres://commander_adapter_ops:commander_adapter_ops@postgres:5432/commander?sslmode=verify-full}
      - COMMANDER_KERNEL_DATABASE_URL=${COMMANDER_ADAPTER_OPS_DATABASE_URL:-postgres://commander_adapter_ops:commander_adapter_ops@postgres:5432/commander?sslmode=verify-full}
      - COMMANDER_DATABASE_TLS_CA_FILE=/run/commander/database-tls/ca.crt
      - COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256=${COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256:?set COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256}
      - COMMANDER_ADAPTER_OPS_INSTANCE_ID=${COMMANDER_ADAPTER_OPS_INSTANCE_ID:-local}
      - COMMANDER_ADAPTER_OPS_CLAIM_SECRET_DIR=/var/run/commander/adapter-ops
      # Same fail-closed tenant scope as worker (resolveWorkerTenantScope on postgres path).
      - COMMANDER_WORKER_TENANTS=${COMMANDER_WORKER_TENANTS:-${COMMANDER_CELL_TENANT_ID:-local}}
      - COMMANDER_ADAPTER_OPS_HEALTH_PORT=8082
      - COMMANDER_CELL_TIER=demo
      - COMMANDER_CELL_TENANT_ID=${COMMANDER_CELL_TENANT_ID:-local}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - COMMANDER_ADAPTER_EGRESS_ALLOWLIST=${COMMANDER_ADAPTER_EGRESS_ALLOWLIST:-api.github.com}
      - COMMANDER_KUBERNETES_CLUSTER=${COMMANDER_KUBERNETES_CLUSTER:-}
      - COMMANDER_KUBERNETES_SERVER=${COMMANDER_KUBERNETES_SERVER:-}
      - COMMANDER_KUBERNETES_TOKEN_ENV=${COMMANDER_KUBERNETES_TOKEN_ENV:-}
      - COMMANDER_KUBERNETES_NAMESPACES=${COMMANDER_KUBERNETES_NAMESPACES:-}
      - COMMANDER_KUBERNETES_BEARER_TOKEN=${COMMANDER_KUBERNETES_BEARER_TOKEN:-}
      # Adapter authority: same Ed25519 contract as worker (fail-closed).
      - COMMANDER_CAPABILITY_PRIVATE_KEY_PEM=${COMMANDER_CAPABILITY_PRIVATE_KEY_PEM:?set COMMANDER_CAPABILITY_PRIVATE_KEY_PEM}
      - COMMANDER_CAPABILITY_KEY_ID=${COMMANDER_CAPABILITY_KEY_ID:?set COMMANDER_CAPABILITY_KEY_ID}
      - COMMANDER_CAPABILITY_JWKS_JSON=${COMMANDER_CAPABILITY_JWKS_JSON:?set COMMANDER_CAPABILITY_JWKS_JSON}
      - COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM=${COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM:?set COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM}
      - COMMANDER_EVIDENCE_SIGNING_KEY_ID=${COMMANDER_EVIDENCE_SIGNING_KEY_ID:?set COMMANDER_EVIDENCE_SIGNING_KEY_ID}
    expose:
      - '8082'
    volumes:
      - adapter-ops-claim-secrets:/var/run/commander/adapter-ops
      - database-ca-runtime:/run/commander/database-tls:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8082/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      kernel-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
      - cell
