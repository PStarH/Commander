# =============================================================================
# Commander — Architecture V2 (kernel-on) local/staging stack
# =============================================================================
# Usage:
#   export COMMANDER_API_KEY="$(openssl rand -hex 32)"
#   export POSTGRES_PASSWORD="$(openssl rand -hex 16)"   # REQUIRED, no default
#   export COMMANDER_MASTER_KEY=… JWT_SECRET=… COMMANDER_CAPABILITY_TOKEN_KEY=…
#   export COMMANDER_INTEGRITY_KEY=… ADMIN_PASSWORD=…
#   export COMMANDER_CAPABILITY_PRIVATE_KEY_PEM=… COMMANDER_CAPABILITY_KEY_ID=…
#   export COMMANDER_CAPABILITY_JWKS_JSON=…   # worker/adapter Ed25519 authority
#   export COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM=… COMMANDER_EVIDENCE_SIGNING_KEY_ID=…
#   docker compose -f docker-compose.yml -f docker-compose.v2.yml --profile v2 up -d --build
#   # or: pnpm docker:v2
#
# Kernel-on services construct verified PostgreSQL pools, so they need the
# pinned-TLS material. Pass it as an explicit third file on the command line
# (docker compose -f docker-compose.yml -f <this> -f docker-compose.kernel-tls.yml);
# `include:` is not used because `docker compose up` rejects the resulting
# service redefinition with "services.<name> conflicts with imported resource".

# This override forces the Gateway onto the shared execution kernel and starts
# postgres + worker plane via the `v2` profile declared in docker-compose.yml.
#
# This is the production-shaped path: every activated service sets
# NODE_ENV=production and COMMANDER_KERNEL_ENABLED=1 explicitly (so it cannot
# inherit the base file's local `COMMANDER_KERNEL_ENABLED=0`), and the
# profile-gated worker/adapter-ops re-impose the required `:?` Ed25519 guards the
# base file relaxed for interpolation safety. POSTGRES_PASSWORD has no public
# default here.
#
# Authority mapping (bench role passwords; see deploy/docker/postgres-init.bench.sql):
#   kernel-migrate → commander_owner   (from base; do not re-pin shared login)
#   api            → commander_app
#   kernel-ops     → commander_scheduler
#   worker         → commander_worker
#   adapter-ops    → commander_adapter_ops
# Worker tenant default for v2: tenant-local (explicit; never '*').
#
# P0 status: kernel-on override for local/staging. Fencing + terminal proof is
# ENFORCED by package e2e + pnpm p0:full-loop (see docs/p0-parallel-status.md).
# This compose file is wiring for operators, not the CI proof harness.
# =============================================================================

services:
  api:
    environment:
      - NODE_ENV=production
      - COMMANDER_KERNEL_ENABLED=1
      # Legacy /api stores are not canonical authority and must not run DDL as commander_app.
      - API_STORE_BACKEND=memory
      - COMMANDER_MEMORY_STORE=in-memory
      - COMMANDER_KERNEL_BACKEND=postgres
      # Hardcoded role DSNs — block host DATABASE_URL bleed / shared commander login.
      - COMMANDER_DEFAULT_POLICY_SNAPSHOT_ID=${COMMANDER_DEFAULT_POLICY_SNAPSHOT_ID:-policy-default-v1}
      - COMMANDER_DEFAULT_TENANT_ID=${COMMANDER_DEFAULT_TENANT_ID:-tenant-local}
      - COMMANDER_DEFAULT_AGENT_DEFINITION_VERSION=${COMMANDER_DEFAULT_AGENT_DEFINITION_VERSION:-v1}
      - COMMANDER_DEFAULT_PROVIDER=${COMMANDER_DEFAULT_PROVIDER:-openai}
      - COMMANDER_DEFAULT_MODEL=${COMMANDER_DEFAULT_MODEL:-gpt-4o}
    depends_on:
      postgres:
        condition: service_healthy
      # The API requires the migrated schema at first boot, not merely a healthy
      # (empty) Postgres — depend on the owner migration completing.
      kernel-migrate:
        condition: service_completed_successfully

  worker:
    environment:
      # Explicit production + kernel-on: never inherit the base local switch.
      - NODE_ENV=production
      - COMMANDER_KERNEL_ENABLED=1
      # Explicit tenant scope (required). Align with COMMANDER_DEFAULT_TENANT_ID; never '*'.
      - COMMANDER_WORKER_TENANTS=${COMMANDER_WORKER_TENANTS:-tenant-local}
      # Re-impose the fail-closed Ed25519 guards the base file relaxed for
      # profile-interpolation safety. The worker runtime rejects empty keys.
      - COMMANDER_CAPABILITY_PRIVATE_KEY_PEM=${COMMANDER_CAPABILITY_PRIVATE_KEY_PEM:?set COMMANDER_CAPABILITY_PRIVATE_KEY_PEM}
      - COMMANDER_CAPABILITY_KEY_ID=${COMMANDER_CAPABILITY_KEY_ID:?set COMMANDER_CAPABILITY_KEY_ID}
      - COMMANDER_CAPABILITY_JWKS_JSON=${COMMANDER_CAPABILITY_JWKS_JSON:?set COMMANDER_CAPABILITY_JWKS_JSON}
      - COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM=${COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM:?set COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM}
      - COMMANDER_EVIDENCE_SIGNING_KEY_ID=${COMMANDER_EVIDENCE_SIGNING_KEY_ID:?set COMMANDER_EVIDENCE_SIGNING_KEY_ID}

  kernel-ops:
    environment:
      - NODE_ENV=production
      - COMMANDER_KERNEL_ENABLED=1

  adapter-ops:
    environment:
      - NODE_ENV=production
      - COMMANDER_KERNEL_ENABLED=1
      - COMMANDER_WORKER_TENANTS=${COMMANDER_WORKER_TENANTS:-tenant-local}
      - COMMANDER_CELL_TENANT_ID=${COMMANDER_CELL_TENANT_ID:-tenant-local}
      - COMMANDER_ADAPTER_EGRESS_ALLOWLIST=${COMMANDER_ADAPTER_EGRESS_ALLOWLIST:-api.github.com}
      - COMMANDER_KUBERNETES_CLUSTER=${COMMANDER_KUBERNETES_CLUSTER:-}
      - COMMANDER_KUBERNETES_SERVER=${COMMANDER_KUBERNETES_SERVER:-}
      - COMMANDER_KUBERNETES_TOKEN_ENV=${COMMANDER_KUBERNETES_TOKEN_ENV:-}
      - COMMANDER_KUBERNETES_BEARER_TOKEN=${COMMANDER_KUBERNETES_BEARER_TOKEN:-}
      - COMMANDER_ADAPTER_OPS_INSTANCE_ID=${COMMANDER_ADAPTER_OPS_INSTANCE_ID:-local}
      - COMMANDER_ADAPTER_OPS_CLAIM_SECRET_DIR=/var/run/commander/adapter-ops
      # Same fail-closed Ed25519 contract as worker (no HMAC fallback).
      - COMMANDER_CAPABILITY_PRIVATE_KEY_PEM=${COMMANDER_CAPABILITY_PRIVATE_KEY_PEM:?set COMMANDER_CAPABILITY_PRIVATE_KEY_PEM}
      - COMMANDER_CAPABILITY_KEY_ID=${COMMANDER_CAPABILITY_KEY_ID:?set COMMANDER_CAPABILITY_KEY_ID}
      - COMMANDER_CAPABILITY_JWKS_JSON=${COMMANDER_CAPABILITY_JWKS_JSON:?set COMMANDER_CAPABILITY_JWKS_JSON}
      - COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM=${COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM:?set COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM}
      - COMMANDER_EVIDENCE_SIGNING_KEY_ID=${COMMANDER_EVIDENCE_SIGNING_KEY_ID:?set COMMANDER_EVIDENCE_SIGNING_KEY_ID}
    volumes:
      - adapter-ops-claim-secrets:/var/run/commander/adapter-ops

  postgres:
    # App/scheduler/worker/owner LOGIN roles come from postgres-init.bench.sql.
    # SECURITY: the superuser password is REQUIRED here (no public default) —
    # the base file only relaxes it so the inactive `database` profile cannot
    # block the local SQLite stack; the v2 path is never allowed to inherit a
    # known credential.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-commander}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-commander}
