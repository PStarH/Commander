name: Python SDK Publish

# Supply chain: every remote `uses:` is pinned to an immutable 40-hex commit SHA.
# SHAs resolved from the upstream repositories via the GitHub API on 2026-09-17;
# the human-readable ref each SHA was resolved from is kept as a trailing comment.
# Enforced by scripts/workflow-supply-chain.test.ts.
on:
  release:
    types: [published]

defaults:
  run:
    working-directory: packages/python-sdk

# Least privilege: the workflow default is read-only; any job that needs a write scope
# or an OIDC token declares it explicitly on that job.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/python-sdk/dist
