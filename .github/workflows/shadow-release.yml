name: Shadow Release

# Supply chain: every remote `uses:` is pinned to an immutable 40-hex commit SHA.
# SHAs resolved from the upstream repositories via the GitHub API on 2026-09-17;
# the human-readable ref each SHA was resolved from is kept as a trailing comment.
# Enforced by scripts/workflow-supply-chain.test.ts.
on:
  # `codex/first-customer-trial-20260908` is the line the pilot is actually being
  # prepared on. This workflow -- the only thing that runs the 13-suite Phase A
  # gate and assembles the customer bundle -- used to trigger solely on PRs into
  # `codex/release-20260810`, so on the trial line it could never run at all.
  # `workflow_dispatch` lets the release owner cut a bundle from an exact clean
  # revision without opening a PR.
  pull_request:
    branches: [codex/release-20260810, codex/first-customer-trial-20260908]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-phase-a-postgres:
    name: Shadow Phase A PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commander
          POSTGRES_PASSWORD: commander
          POSTGRES_DB: commander
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commander -d commander"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COMMANDER_SHADOW_PG_ADMIN_URL: postgres://commander:commander@localhost:5432/commander
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shadow Phase A gate contract
        run: pnpm exec node --import tsx --test scripts/shadow-phase-a-gate.test.ts
      - name: Shadow Phase A release gate
        run: pnpm shadow:phase-a:gate
      - name: Package customer trial
        run: |
          mkdir shadow-customer-trial
          pnpm --dir packages/contracts pack --pack-destination "$PWD/shadow-customer-trial"
          pnpm --dir packages/postgres-runtime pack --pack-destination "$PWD/shadow-customer-trial"
          pnpm --dir packages/shadow-plane pack --pack-destination "$PWD/shadow-customer-trial"
          cp -R docs/pilot/shadow shadow-customer-trial/guide
          git rev-parse HEAD > shadow-customer-trial/SOURCE_REVISION
          cd shadow-customer-trial
          sha256sum *.tgz > SHA256SUMS
      - name: Customer trial artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-customer-trial
          path: shadow-customer-trial
          if-no-files-found: error
          retention-days: 14
      - name: Sanitized Shadow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-phase-a-evidence
          path: shadow-phase-a-evidence.json
          if-no-files-found: error
          retention-days: 7
