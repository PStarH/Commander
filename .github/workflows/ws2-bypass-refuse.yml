name: WS2 Bypass Refuse

# Supply chain: every remote `uses:` is pinned to an immutable 40-hex commit SHA.
# SHAs resolved from the upstream repositories via the GitHub API on 2026-09-17;
# the human-readable ref each SHA was resolved from is kept as a trailing comment.
# Enforced by scripts/workflow-supply-chain.test.ts.
# WS2 §4 / §10 Phase 2.7: independent CI gate that fails the build when any
# EffectBroker bypass pattern is present in production source. Runs the static
# scanner (scripts/ws2-build-gate.mjs) and asserts a clean exit. This workflow
# is intentionally separate from ci.yml so a bypass cannot be hidden by
# disabling the main CI job.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege: the workflow default is read-only; any job that needs a write scope
# or an OIDC token declares it explicitly on that job.
permissions:
  contents: read

jobs:
  ws2-build-gate:
    name: WS2 EffectBroker bypass scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Run WS2 build gate
        run: |
          node scripts/ws2-build-gate.mjs
          echo "WS2 build gate: 0 bypass patterns confirmed"
