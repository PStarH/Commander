name: Python SDK CI

# Supply chain: every remote `uses:` is pinned to an immutable 40-hex commit SHA.
# SHAs resolved from the upstream repositories via the GitHub API on 2026-09-17;
# the human-readable ref each SHA was resolved from is kept as a trailing comment.
# Enforced by scripts/workflow-supply-chain.test.ts.
on:
  push:
    branches: [master, main]
    paths:
      - 'packages/python-sdk/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'packages/python-sdk/**'

defaults:
  run:
    working-directory: packages/python-sdk

# Least privilege: the workflow default is read-only; any job that needs a write scope
# or an OIDC token declares it explicitly on that job.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python-sdk/pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with pyright
        # Use the project's [tool.pyright] config (include = ["src"]); passing
        # explicit paths on the CLI overrides it and scans tests too, which the
        # project has never scoped.
        run: pyright -p .

      # The Node workspace has a dependency-vulnerability gate in CI; the
      # published Python SDK had none, so an advisory in httpx or pydantic would
      # have shipped silently. `pip-audit .` resolves the *declared* dependency
      # set from pyproject.toml rather than auditing the runner's own tooling
      # (auditing the environment instead reports advisories against `pip`
      # itself, which is not this project's dependency). Verified locally:
      # `pip-audit .` → "No known vulnerabilities found".
      - name: Audit dependencies with pip-audit
        run: |
          pip install --quiet pip-audit
          python -m pip_audit . --progress-spinner off

      - name: Test with pytest
        run: python -m pytest tests/ -v --tb=short -q
