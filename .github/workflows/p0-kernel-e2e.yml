name: P0 Kernel E2E

# Lightweight gate for Architecture V2 closure work.
# Complements ci.yml kernel-postgres-integration; runs on P0 branches and PRs.

on:
  push:
    branches:
      - 'p0/**'
      - master
      - main
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  p0-kernel-e2e:
    name: P0 Gateway / Kernel / Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commander
          POSTGRES_PASSWORD: commander
          POSTGRES_DB: commander
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commander -d commander"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://commander:commander@localhost:5432/commander
      COMMANDER_KERNEL_DATABASE_URL: postgres://commander:commander@localhost:5432/commander
      P0_TIMEOUT_MS: '120000'
      GIT_TERMINAL_PROMPT: '0'
      # AgentRuntime side-effects must not require a durable path in CI workers
      COMMANDER_INTERACTION_DB: ':memory:'
      # full-loop uses deterministic worker executor (not full AgentRuntime)
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - name: Configure verified PostgreSQL TLS for runtime consumers
        shell: bash
        run: |
          TLS_DIR="$GITHUB_WORKSPACE/artifacts/ci-postgres-tls"
          mkdir -p "$TLS_DIR"
          openssl genrsa -out "$TLS_DIR/ca.key" 2048
          openssl req -x509 -new -nodes -key "$TLS_DIR/ca.key" -sha256 -days 1 -subj '/CN=commander-ci-postgres-ca' -out "$TLS_DIR/ca.crt"
          openssl genrsa -out "$TLS_DIR/server.key" 2048
          openssl req -new -key "$TLS_DIR/server.key" -subj '/CN=localhost' -out "$TLS_DIR/server.csr"
          openssl x509 -req -in "$TLS_DIR/server.csr" -CA "$TLS_DIR/ca.crt" -CAkey "$TLS_DIR/ca.key" -CAcreateserial -out "$TLS_DIR/server.crt" -days 1 -sha256 -extfile <(printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\n')
          PG_CONTAINER="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -1)"
          test -n "$PG_CONTAINER"
          docker cp "$TLS_DIR/." "$PG_CONTAINER:/tmp/ci-postgres-tls/"
          docker exec -u 0 "$PG_CONTAINER" sh -ec 'install -d -o postgres -g postgres -m 0755 /var/lib/postgresql/data/ci-postgres-tls; install -o postgres -g postgres -m 0644 /tmp/ci-postgres-tls/ca.crt /var/lib/postgresql/data/ci-postgres-tls/ca.crt; install -o postgres -g postgres -m 0644 /tmp/ci-postgres-tls/server.crt /var/lib/postgresql/data/ci-postgres-tls/server.crt; install -o postgres -g postgres -m 0600 /tmp/ci-postgres-tls/server.key /var/lib/postgresql/data/ci-postgres-tls/server.key'
          docker exec -u postgres "$PG_CONTAINER" psql -U commander -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl = 'on'; ALTER SYSTEM SET ssl_ca_file = '/var/lib/postgresql/data/ci-postgres-tls/ca.crt'; ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/data/ci-postgres-tls/server.crt'; ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/data/ci-postgres-tls/server.key';"
          docker restart "$PG_CONTAINER"
          until docker exec "$PG_CONTAINER" pg_isready -U commander -d commander; do sleep 1; done
          SPKI_SHA256="$(openssl x509 -pubkey -noout -in "$TLS_DIR/server.crt" | openssl pkey -pubin -outform DER | openssl dgst -sha256 -r | awk '{print $1}')"
          test "${#SPKI_SHA256}" -eq 64
          echo "COMMANDER_DATABASE_TLS_CA_FILE=$GITHUB_WORKSPACE/artifacts/ci-postgres-tls/ca.crt" >> "$GITHUB_ENV"
          echo "COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256=$SPKI_SHA256" >> "$GITHUB_ENV"
      - name: Rebuild better-sqlite3 (ignore-scripts=true)
        run: pnpm rebuild better-sqlite3
      - name: Build packages
        run: |
          pnpm --filter @commander/contracts build
          pnpm --filter @commander/plugin-sdk build
          pnpm --filter @commander/effect-broker build
          pnpm --filter @commander/kernel build
          pnpm --filter @commander/core build
          pnpm --filter @commander/action-adapters build
          pnpm --filter @commander/worker-plane build
          pnpm --filter @commander/api build
      - name: Kernel PG integration
        run: pnpm exec tsx --test packages/kernel/src/postgres.integration.test.ts
      - name: Worker e2e + reclaim
        run: pnpm exec tsx --test --test-force-exit packages/worker-plane/src/e2e/gateway-kernel-worker.e2e.test.ts
      - name: Full loop to SUCCEEDED
        run: pnpm p0:full-loop
