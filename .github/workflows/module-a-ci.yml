name: Module A CI

# Supply chain: every remote `uses:` is pinned to an immutable 40-hex commit SHA.
# SHAs resolved from the upstream repositories via the GitHub API on 2026-09-17;
# the human-readable ref each SHA was resolved from is kept as a trailing comment.
# Enforced by scripts/workflow-supply-chain.test.ts.
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'packages/contracts/**'
      - 'packages/effect-broker/**'
      - 'packages/kernel/**'
      - 'packages/worker-plane/**'
      - 'packages/action-adapters/**'
      - 'packages/core/**'
      - 'packages/plugin-sdk/**'
      - 'packages/postgres-runtime/**'
      - 'apps/api/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/module-a-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'packages/contracts/**'
      - 'packages/effect-broker/**'
      - 'packages/kernel/**'
      - 'packages/worker-plane/**'
      - 'packages/action-adapters/**'
      - 'packages/core/**'
      - 'packages/plugin-sdk/**'
      - 'packages/postgres-runtime/**'
      - 'apps/api/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/module-a-ci.yml'

permissions:
  contents: read

concurrency:
  group: module-a-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  module-a-gates:
    name: Module A local authority gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      COMMANDER_CI_EVIDENCE_DIR: .internal/evidence/ci/module-a
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Module A gates
        run: bash scripts/ci/module-a-gates.sh

      - name: Upload Module A evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-a-evidence-${{ github.run_id }}
          path: .internal/evidence/ci/module-a/
          if-no-files-found: error
          retention-days: 14
