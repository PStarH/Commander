# =============================================================================
# Commander — Docker Compose
# Local-first base file. NOT a standalone runnable deployment — see below.
#
# Optional add-on stacks (started only when their profile is requested):
#   docker compose --profile distributed up      # Redis for distributed EventBus
#   docker compose --profile observability up    # Prometheus + Grafana
#   docker compose --profile tracing up          # Jaeger (OTLP traces)
#   docker compose --profile database up         # PostgreSQL only
#   docker compose --profile worker up           # worker plane (adds postgres + migrations)
#   docker compose -f docker-compose.yml -f docker-compose.v2.yml --profile v2 up
#     # P0 Architecture V2: api kernel-on + postgres + worker plane
#   docker compose -f docker-compose.yml -f docker-compose.cell.yml --profile cell up
#     # L4-07 Cell v0: api + worker + kernel-ops + adapter-ops + postgres
# =============================================================================
# Local-first design: the default `docker compose up` runs ONLY api (the web
# console is opt-in via `--profile web`). Distributed/observability services are
# opt-in so single-box deployments stay lightweight (no Redis/Prometheus
# overhead unless requested).
#
# LOCAL/DEVELOPMENT ONLY (this base file). The api service runs with
# NODE_ENV=development, COMMANDER_KERNEL_ENABLED=0, no injected DATABASE_URL or
# COMMANDER_KERNEL_DATABASE_URL, and the default SQLite API store. This is
# deliberate: production startup (apps/api/src/index.ts) refuses to boot without
# an initialized durable kernel and a durable store, so a SQLite / no-DB default
# cannot honestly advertise NODE_ENV=production. Host ports bind to 127.0.0.1 so
# a local box is not exposed on the LAN. The strong API startup credentials
# (COMMANDER_API_KEY, COMMANDER_MASTER_KEY, JWT_SECRET,
# COMMANDER_CAPABILITY_TOKEN_KEY, COMMANDER_INTEGRITY_KEY, ADMIN_PASSWORD) stay
# required here — "local" never means unauthenticated. For a production-shaped,
# kernel-backed path use docker-compose.v2.yml, docker-compose.cell.yml, or
# docker-compose.prod.yml.
#
# NOT RUNNABLE AS-IS. The api service also receives no DATABASE_URL, and all
# five auth authorities (users, API keys, refresh tokens, auth failures, rate
# limits) are PostgreSQL-only with no local/SQLite/in-memory fallback
# (apps/api/src/authDb.ts throws AUTH_DATABASE_URL_REQUIRED, and requires the
# commander_app role). A container started from this base file therefore exits
# during startup with `COMMANDER_API_STARTUP_FAILED: AUTH_DATABASE_URL_REQUIRED`
# — the kernel/store reasoning below is not the only startup precondition. The
# v2 and cell overrides inject
# DATABASE_URL=postgres://commander_app:...@postgres:5432/commander and do boot;
# use one of those (or docker-compose.prod.yml) for anything that must run.
#
# Profile interpolation: `docker compose` interpolates every service in every
# loaded file, including services whose profile is inactive. A required-variable
# guard (the `:?` interpolation operator) inside a profile-gated service
# therefore breaks unrelated commands (plain `docker compose up` would fail on an
# unset worker key). Base keeps the optional-default operator (`:-`) for
# profile-gated services and the v2/cell overrides re-impose the required `:?`
# guards where those services are actually activated. Relaxing the compose guard
# does not weaken the process: the runtimes still fail closed on empty key
# material (CAPABILITY_AUTHORITY_REQUIRED / EVIDENCE_SIGNING_KEY_REQUIRED).
#
# The API SQLite state lives at <cwd>/.commander (see
# apps/api/src/stores/apiStore.ts DEFAULT_DB_PATH) plus the ATR/compensation
# SQLite files and the knowledge-base dir, so it is backed by the
# commander_local_state named volume. The API image pre-creates this directory
# owned by uid 1001; Docker preserves that ownership when initializing the volume.
# =============================================================================

services:
  # API server — War Room backend + Commander execution engine
  # LOCAL/DEVELOPMENT profile: SQLite store, kernel explicitly off, no DSN.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        - NODE_ENV=development
    ports:
      # Loopback only — a local stack must not be reachable from the LAN.
      - '127.0.0.1:4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      # Bind deliberately for Docker port publishing; the API defaults to loopback otherwise.
      - API_HOST=0.0.0.0
      - COMMANDER_API_REPLICAS=1
      # Security: Require API key to be set. Fail fast if missing.
      - 'COMMANDER_API_KEY=${COMMANDER_API_KEY:?COMMANDER_API_KEY is required. Generate one with: openssl rand -hex 32}'
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      # Distributed EventBus — defaults to in-memory (local-first). Set to
      # `redis` + provide COMMANDER_EVENT_BUS_REDIS_URL to enable cross-node
      # fan-out. When the `distributed` profile is active, the `redis` service
      # below provides the URL automatically.
      - COMMANDER_EVENT_BUS_BACKEND=${COMMANDER_EVENT_BUS_BACKEND:-memory}
      - COMMANDER_EVENT_BUS_REDIS_URL=${COMMANDER_EVENT_BUS_REDIS_URL:-redis://redis:6379}
      # OTLP exporter — points at the `otel-collector`/`jaeger` service when the
      # tracing profile is active. No-op when OTEL_EXPORTER_OTLP_ENDPOINT is unset.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Database backend: sqlite (default) | memory | postgres. This base file
      # injects NO DATABASE_URL and NO kernel DSN: a DSN would flip
      # isCommanderKernelEnabled() auto-on and drag the local stack onto the
      # production kernel path. Postgres DSNs live in the v2/cell overrides.
      - API_STORE_BACKEND=${API_STORE_BACKEND:-sqlite}
      # Architecture V2 shared execution kernel — explicitly OFF for the local
      # SQLite stack. Never unset here: production-shaped DSNs are supplied by
      # the v2/cell overrides, which set COMMANDER_KERNEL_ENABLED=1 so they do
      # not inherit this local disabled switch.
      - COMMANDER_KERNEL_ENABLED=${COMMANDER_KERNEL_ENABLED:-0}
      - COMMANDER_KERNEL_BACKEND=${COMMANDER_KERNEL_BACKEND:-postgres}
      # Startup credentials are explicit so a published container never starts
      # with a public JWT or a known initial-admin password. These are required
      # even in the local profile.
      - 'COMMANDER_MASTER_KEY=${COMMANDER_MASTER_KEY:?COMMANDER_MASTER_KEY is required}'
      - 'JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}'
      - 'COMMANDER_CAPABILITY_TOKEN_KEY=${COMMANDER_CAPABILITY_TOKEN_KEY:?COMMANDER_CAPABILITY_TOKEN_KEY is required}'
      - 'COMMANDER_INTEGRITY_KEY=${COMMANDER_INTEGRITY_KEY:?COMMANDER_INTEGRITY_KEY is required}'
      - 'ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required for the initial admin account}'
      # CORS origins — comma-separated. NEVER use '*' in production.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      # SQLite API state + ATR/compensation DBs + knowledge base (<cwd>/.commander).
      - commander_local_state:/app/.commander
      - commander_state:/app/.commander_state
      - commander_traces:/app/.commander_traces
      - commander_memory:/app/.commander_memory
      - commander_results:/app/.commander_results
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Worker — executes durable kernel steps ───────────────────────────────
  # Started with: docker compose --profile worker up
  #            or docker compose -f docker-compose.yml -f docker-compose.v2.yml --profile v2 up
  # Requires durable kernel ON (auto when DSN set / production) and Postgres.
  worker:
    build:
      context: .
      dockerfile: packages/worker-plane/Dockerfile
      args:
        - NODE_ENV=production
    environment:
      - NODE_ENV=production
      # Worker/adapter authority: commander_worker (RLS-enforced, no BYPASSRLS).
      - DATABASE_URL=${COMMANDER_WORKER_DATABASE_URL:-postgres://commander_worker:commander_worker@postgres:5432/commander}
      - COMMANDER_KERNEL_DATABASE_URL=${COMMANDER_WORKER_DATABASE_URL:-postgres://commander_worker:commander_worker@postgres:5432/commander}
      - COMMANDER_KERNEL_BACKEND=postgres
      - COMMANDER_WORKER_BOOTSTRAP=/app/packages/worker-plane/dist/bootstrap.js
      - COMMANDER_WORKER_AUTH_TOKEN=${COMMANDER_WORKER_AUTH_TOKEN:-worker-token}
      - COMMANDER_WORKER_AUTH_SUBJECT=${COMMANDER_WORKER_AUTH_SUBJECT:-worker}
      - COMMANDER_WORKER_CAPABILITIES=${COMMANDER_WORKER_CAPABILITIES:-agent,tool,connector}
      - COMMANDER_WORKER_MAX_CONCURRENCY=${COMMANDER_WORKER_MAX_CONCURRENCY:-10}
      # Explicit tenant scope (required). Workers reject '*'/empty at bootstrap.
      - COMMANDER_WORKER_TENANTS=${COMMANDER_WORKER_TENANTS:-tenant-local}
      - COMMANDER_WORKER_LEASE_TTL_MS=${COMMANDER_WORKER_LEASE_TTL_MS:-30000}
      - COMMANDER_WORKER_HEARTBEAT_MS=${COMMANDER_WORKER_HEARTBEAT_MS:-10000}
      - COMMANDER_WORKER_POLL_MS=${COMMANDER_WORKER_POLL_MS:-250}
      - COMMANDER_EFFECT_BROKER_SEED=${COMMANDER_EFFECT_BROKER_SEED:-}
      # Production worker: Ed25519 authority fail-closed (no HMAC capability-token-key).
      # Optional-default operator (not the required `:?` operator) because this
      # service is profile-gated and compose interpolates inactive services too.
      # docker-compose.v2.yml re-imposes the required guards, and the worker
      # bootstrap still fails closed on empty key material
      # (CAPABILITY_AUTHORITY_REQUIRED / EVIDENCE_SIGNING_KEY_REQUIRED).
      - COMMANDER_CAPABILITY_PRIVATE_KEY_PEM=${COMMANDER_CAPABILITY_PRIVATE_KEY_PEM:-}
      - COMMANDER_CAPABILITY_KEY_ID=${COMMANDER_CAPABILITY_KEY_ID:-}
      - COMMANDER_CAPABILITY_JWKS_JSON=${COMMANDER_CAPABILITY_JWKS_JSON:-}
      - COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM=${COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM:-}
      - COMMANDER_EVIDENCE_SIGNING_KEY_ID=${COMMANDER_EVIDENCE_SIGNING_KEY_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      # Never execute durable steps against an unmigrated schema.
      kernel-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
      - worker
      - v2

  kernel-migrate:
    build:
      context: .
      dockerfile: packages/kernel/Dockerfile.ops
    entrypoint: ["node", "packages/kernel/dist/migrate.js"]
    # Apply the Task-1 closure, not just the baseline descriptor set. With no
    # argument, `main()` resolves closurePhase=undefined and runKernelMigrations
    # stops at KERNEL_TASK1_BASELINE_MIGRATIONS until the canonical enforce
    # closure row exists — so the auth-persistence schema the API queries at
    # first boot (commander_auth_users and friends) would never be created and
    # the Gateway would die with `relation "commander_auth_users" does not
    # exist`. Helm's owner Job passes the same argument and phase (see
    # deploy/helm/commander/templates/migration-job.yaml), and the production
    # compose driver passes it to `compose run` (scripts/compose-tenant-cutover.ts).
    command: ["tenant-cutover-migrate"]
    environment:
      - NODE_ENV=production
      # Closure phase. `enforce` is the fresh-install phase and matches the
      # chart default (tenantAuthority.cutoverPhase). A legacy upgrade runs
      # `expand` first and then `enforce`; override to sequence that rollout.
      - COMMANDER_TENANT_AUTHORITY_CUTOVER_PHASE=${COMMANDER_TENANT_AUTHORITY_CUTOVER_PHASE:-enforce}
      # Migration owner authority (owns schema, runs migrations, BYPASSRLS).
      - DATABASE_URL=${COMMANDER_OWNER_DATABASE_URL:-postgres://commander_owner:commander_owner@postgres:5432/commander}
      - COMMANDER_KERNEL_DATABASE_URL=${COMMANDER_OWNER_DATABASE_URL:-postgres://commander_owner:commander_owner@postgres:5432/commander}
      - COMMANDER_KERNEL_BACKEND=postgres
      - COMMANDER_ADAPTER_OPS_PASSWORD=${COMMANDER_ADAPTER_OPS_PASSWORD:-commander_adapter_ops}
      # Explicit worker tenant allowlist seeded by the owner migration
      # (packages/kernel/src/migrate.ts seeds commander_worker_allowed_tenants from
      # COMMANDER_WORKER_ALLOWED_TENANTS ?? COMMANDER_WORKER_TENANTS). Both are
      # spelled out so the v2 profile — which inherits this block — is not left
      # unseeded. Never '*'.
      - COMMANDER_WORKER_TENANTS=${COMMANDER_WORKER_TENANTS:-tenant-local}
      - COMMANDER_WORKER_ALLOWED_TENANTS=${COMMANDER_WORKER_ALLOWED_TENANTS:-${COMMANDER_WORKER_TENANTS:-tenant-local}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles:
      - worker
      - v2

  # ── Kernel Ops — reclaim + timers + durable outbox publication ──────────
  # Started with: docker compose --profile worker|v2 up
  kernel-ops:
    build:
      context: .
      dockerfile: packages/kernel/Dockerfile.ops
    environment:
      - NODE_ENV=production
      # Scheduler/recovery authority: commander_scheduler (BYPASSRLS, no CREATEROLE).
      - DATABASE_URL=${COMMANDER_SCHEDULER_DATABASE_URL:-postgres://commander_scheduler:commander_scheduler@postgres:5432/commander}
      - COMMANDER_KERNEL_DATABASE_URL=${COMMANDER_SCHEDULER_DATABASE_URL:-postgres://commander_scheduler:commander_scheduler@postgres:5432/commander}
      - COMMANDER_KERNEL_BACKEND=postgres
      - COMMANDER_RECLAIM_INTERVAL_MS=${COMMANDER_RECLAIM_INTERVAL_MS:-5000}
      - COMMANDER_RECLAIM_BATCH_SIZE=${COMMANDER_RECLAIM_BATCH_SIZE:-100}
      - COMMANDER_TIMER_POLL_MS=${COMMANDER_TIMER_POLL_MS:-5000}
      - COMMANDER_TIMER_BATCH_SIZE=${COMMANDER_TIMER_BATCH_SIZE:-100}
      - COMMANDER_OUTBOX_INTERVAL_MS=${COMMANDER_OUTBOX_INTERVAL_MS:-1000}
      - COMMANDER_OUTBOX_BATCH_SIZE=${COMMANDER_OUTBOX_BATCH_SIZE:-100}
      - COMMANDER_OUTBOX_MAX_ATTEMPTS=${COMMANDER_OUTBOX_MAX_ATTEMPTS:-10}
      # Single source: host/compose .env → container env → in-container healthcheck.
      - COMMANDER_OPS_HEALTH_PORT=${COMMANDER_OPS_HEALTH_PORT:-8081}
    expose:
      - ${COMMANDER_OPS_HEALTH_PORT:-8081}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const p=process.env.COMMANDER_OPS_HEALTH_PORT||'8081';fetch('http://127.0.0.1:'+p+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      kernel-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
      - worker
      - v2

  # Adapter reconciliation and compensation drains use a dedicated RPC-only LOGIN.
  adapter-ops:
    build:
      context: .
      dockerfile: packages/adapter-ops/Dockerfile.ops
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${COMMANDER_ADAPTER_OPS_DATABASE_URL:-postgres://commander_adapter_ops:commander_adapter_ops@postgres:5432/commander}
      - COMMANDER_KERNEL_DATABASE_URL=${COMMANDER_ADAPTER_OPS_DATABASE_URL:-postgres://commander_adapter_ops:commander_adapter_ops@postgres:5432/commander}
      - COMMANDER_KERNEL_BACKEND=postgres
      - COMMANDER_WORKER_TENANTS=${COMMANDER_WORKER_TENANTS:-tenant-local}
      - COMMANDER_CELL_TENANT_ID=${COMMANDER_CELL_TENANT_ID:-tenant-local}
      - COMMANDER_ADAPTER_EGRESS_ALLOWLIST=${COMMANDER_ADAPTER_EGRESS_ALLOWLIST:-api.github.com}
      - COMMANDER_KUBERNETES_CLUSTER=${COMMANDER_KUBERNETES_CLUSTER:-}
      - COMMANDER_KUBERNETES_SERVER=${COMMANDER_KUBERNETES_SERVER:-}
      - COMMANDER_KUBERNETES_TOKEN_ENV=${COMMANDER_KUBERNETES_TOKEN_ENV:-}
      - COMMANDER_KUBERNETES_BEARER_TOKEN=${COMMANDER_KUBERNETES_BEARER_TOKEN:-}
      - COMMANDER_ADAPTER_OPS_INSTANCE_ID=${COMMANDER_ADAPTER_OPS_INSTANCE_ID:-local}
      - COMMANDER_ADAPTER_OPS_CLAIM_SECRET_DIR=/var/run/commander/adapter-ops
      - COMMANDER_RECONCILE_INTERVAL_MS=${COMMANDER_RECONCILE_INTERVAL_MS:-10000}
      - COMMANDER_COMPENSATION_INTERVAL_MS=${COMMANDER_COMPENSATION_INTERVAL_MS:-10000}
      # Profile-gated service: see the worker note above. v2/cell re-impose the
      # required `:?` guards; the adapter-ops runtime rejects empty keys in production.
      - COMMANDER_CAPABILITY_PRIVATE_KEY_PEM=${COMMANDER_CAPABILITY_PRIVATE_KEY_PEM:-}
      - COMMANDER_CAPABILITY_KEY_ID=${COMMANDER_CAPABILITY_KEY_ID:-}
      - COMMANDER_CAPABILITY_JWKS_JSON=${COMMANDER_CAPABILITY_JWKS_JSON:-}
      - COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM=${COMMANDER_EVIDENCE_SIGNING_PRIVATE_KEY_PEM:-}
      - COMMANDER_EVIDENCE_SIGNING_KEY_ID=${COMMANDER_EVIDENCE_SIGNING_KEY_ID:-}
    volumes:
      - adapter-ops-claim-secrets:/var/run/commander/adapter-ops
    depends_on:
      kernel-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
      - worker
      - v2

  # Web GUI — Agent War Room dashboard.
  # Builds from the tracked apps/web/Dockerfile. Do NOT point this at the repo
  # root Dockerfile: that file is gitignored and absent from a fresh clone, so
  # the `web` profile would fail to build.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      # Loopback only — a local stack must not be reachable from the LAN.
      - '127.0.0.1:3000:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - web
      - gui

  # ── PostgreSQL — production database backend (opt-in) ──────────────────
  # Started only with: docker compose --profile database up
  # Enables persistent, multi-replica-safe storage for the API state store.
  # Set API_STORE_BACKEND=postgres and
  # DATABASE_URL=postgres://commander:${POSTGRES_PASSWORD}@postgres:5432/commander
  # SECURITY: not published on the host; only reachable on the compose network.
  # For local tooling, bind loopback explicitly (e.g. "127.0.0.1:5432:5432").
  #
  # The optional-default operator on POSTGRES_PASSWORD keeps the required-password
  # guard out of the always-interpolated base file so an inactive `database`
  # profile cannot block `docker compose up` for the SQLite api. This is not a
  # relaxation of the credential policy: the postgres entrypoint refuses to
  # initialize with a blank superuser password, and the v2/cell overrides
  # re-impose the required `:?` guard on POSTGRES_PASSWORD.
  # The init script also seeds the role logins the kernel path requires.
  postgres:
    image: postgres:16-alpine
    container_name: commander-postgres
    expose:
      - '5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-commander}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-commander}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Bench/dev role bootstrap (owner/app/scheduler/worker). First init only.
      - ./deploy/docker/postgres-init.bench.sql:/docker-entrypoint-initdb.d/01-commander-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-commander} -d ${POSTGRES_DB:-commander}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    profiles:
      - database
      # The worker plane is Postgres-backed; keep postgres in the same profile
      # so `--profile worker up` is self-contained.
      - worker
      - v2

  # ── Redis — distributed EventBus backend (opt-in) ──────────────────────
  # Started only with: docker compose --profile distributed up
  # Enables cross-node pub/sub for DistributedEventBus (BackendType='redis').
  # Memory-only single-box deployments do not need this service.
  # SECURITY: not published on the host; only reachable on the compose network.
  redis:
    image: redis:7-alpine
    container_name: commander-redis
    expose:
      - '6379'
    volumes:
      - redis-data:/data
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    profiles:
      - distributed

  # ── Prometheus — metrics scraping (opt-in) ─────────────────────────────
  # Started only with: docker compose --profile observability up
  # Scrapes the api /metrics endpoint. Uses prometheus.compose.yml which
  # targets `api:4000` (service name) instead of host.docker.internal.
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: commander-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./deploy/observability/prometheus/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - observability

  # ── Grafana — pre-configured dashboards (opt-in) ───────────────────────────
  # Started only with: docker compose --profile observability up
  grafana:
    image: grafana/grafana:10.4.0
    container_name: commander-grafana
    ports:
      - '3001:3000'
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/developer-overview.json
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles:
      - observability

  # ── Jaeger — OTLP trace receiver (opt-in) ──────────────────────────────────
  # Started only with: docker compose --profile tracing up
  # Point Commander at it via OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: commander-jaeger
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP HTTP
      - '4317:4317' # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:14269/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - tracing

volumes:
  # SQLite API state + ATR/compensation DBs + knowledge base (<cwd>/.commander).
  commander_local_state:
  commander_state:
  commander_traces:
  commander_memory:
  commander_results:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  adapter-ops-claim-secrets:
